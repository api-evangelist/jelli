name: Jelli
description: Jelli was a programmatic advertising technology company focused on terrestrial and
  broadcast radio, building a real-time platform that let advertisers buy and manage radio spots
  programmatically across broadcast station inventory. Backed by Battery Ventures (among other
  investors), Jelli was acquired by iHeartMedia in 2016 and its technology went on to power
  programmatic and automated audio advertising. The independent Jelli brand is now defunct - the
  jelli.com domain 301-redirects to tritondigital.com, and no Jelli-branded developer portal,
  API reference, or public API host remains. This profile is retained as a portfolio-lead record;
  the enrichment pipeline found no live Jelli developer or API surface to harvest.
